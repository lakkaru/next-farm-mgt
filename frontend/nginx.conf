# ============================================
# Nginx Configuration for Next.js Frontend
# Farm Management System
# ============================================
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/farm-frontend
#   2. Create symlink: ln -s /etc/nginx/sites-available/farm-frontend /etc/nginx/sites-enabled/
#   3. Update SSL certificate paths
#   4. Update server_name to your domain
#   5. Test: nginx -t
#   6. Reload: systemctl reload nginx
# ============================================

# Upstream for Next.js application (PM2)
upstream nextjs_upstream {
    # Use localhost since PM2 runs on same server
    server 127.0.0.1:3000;
    
    # For multiple instances (cluster mode), PM2 handles load balancing internally
    keepalive 64;
}

# Upstream for backend API (Express.js)
upstream backend_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name farm.yourdomain.com;

    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name farm.yourdomain.com;

    # ----------------------
    # SSL Configuration
    # ----------------------
    ssl_certificate /etc/letsencrypt/live/farm.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farm.yourdomain.com/privkey.pem;
    
    # SSL settings (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ----------------------
    # Security Headers
    # ----------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Content Security Policy (adjust as needed)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.yourdomain.com" always;

    # ----------------------
    # Gzip Compression
    # ----------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # ----------------------
    # Brotli Compression (if module available)
    # ----------------------
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;

    # ----------------------
    # Logging
    # ----------------------
    access_log /var/log/nginx/farm-frontend.access.log;
    error_log /var/log/nginx/farm-frontend.error.log;

    # ----------------------
    # Root and Index
    # ----------------------
    root /var/www/farm-mgt-frontend/public;

    # ----------------------
    # Next.js Static Files
    # ----------------------
    # Immutable cache for Next.js build output
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Cache for 1 year (immutable)
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
    }

    # ----------------------
    # Static Assets in /public
    # ----------------------
    location /icons {
        alias /var/www/farm-mgt-frontend/public/icons;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /images {
        alias /var/www/farm-mgt-frontend/public/images;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /manifest.json {
        alias /var/www/farm-mgt-frontend/public/manifest.json;
        add_header Cache-Control "public, max-age=86400";
    }

    location /robots.txt {
        alias /var/www/farm-mgt-frontend/public/robots.txt;
    }

    location /favicon.ico {
        alias /var/www/farm-mgt-frontend/public/favicon.ico;
        expires 30d;
    }

    # ----------------------
    # Backend API Proxy
    # ----------------------
    location /api/ {
        # Remove /api prefix when proxying to backend
        # If your backend expects /api, remove the rewrite line
        # rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # File upload size limit
        client_max_body_size 50M;

        # Disable buffering for streaming
        proxy_buffering off;
    }

    # ----------------------
    # Health Check Endpoint
    # ----------------------
    location /api/health {
        proxy_pass http://nextjs_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        
        # Don't cache health checks
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----------------------
    # Next.js Application
    # ----------------------
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ----------------------
    # Error Pages
    # ----------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
